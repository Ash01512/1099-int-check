name: Deploy

# Merged means live. Without this, `main` and production drift silently:
# a PR can sit unmerged while its code is already deployed, or land and
# never ship. Both happened during development.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # dist/ is gitignored, so CI must build it or there is nothing to upload.
      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        # --branch=main is explicit rather than inferred: Pages treats the
        # production branch by name, and a deploy that silently lands as a
        # preview would leave production stale while the run goes green.
        run: npx wrangler pages deploy --branch=main
        env:
          # Needs "Cloudflare Pages: Edit". The existing token, created from
          # the "Edit Cloudflare Workers" template, turned out to carry it
          # already — confirmed by run 32280595780, where this step succeeded.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret — it appears in every dashboard URL. Kept inline so
          # the deploy does not gain a second way to fail on a missing secret.
          CLOUDFLARE_ACCOUNT_ID: 9b76753285cc0229e3f5161d25710d45

      # Deploying is not the same as working. Prove the page and the API
      # actually respond before calling the run green.
      - name: Verify production
        run: |
          set -uo pipefail
          URL="https://1099-int-check.pages.dev"

          # NEVER write `curl ... | grep -q ...` in this file.
          #
          # grep -q exits the moment it matches. That closes the pipe, curl
          # takes SIGPIPE, and under `set -o pipefail` the pipeline reports
          # CURL's failure even though grep succeeded. Whether it happens at
          # all depends on if curl finished writing before grep exited, so the
          # check passes locally, passes on a small response, and fails on a
          # big one. Run 32284480055 failed the canonical assertion 6/6 while
          # the tag was demonstrably present and served.
          #
          # It also cost a wrong diagnosis: the earlier red run 32280595780
          # was blamed on edge propagation and "fixed" with the retry loop
          # below, which was papering over this instead.
          #
          # So: fetch once into a variable, then match with bash `case`. No
          # pipeline, no subprocess, no exit status to misread. The retry is
          # kept because genuine propagation delay does exist, but it is no
          # longer load bearing.
          verify() {
            local fail=0 code status html headers headers_lc

            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/healthz")
            echo "  GET /healthz -> $code"
            [ "$code" = "200" ] || fail=1

            status=$(curl -s --max-time 30 "$URL/api/status")
            echo "  GET /api/status -> $status"
            case "$status" in *'"configured":true'*) ;; *) fail=1 ;; esac

            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/")
            echo "  GET / -> $code"
            [ "$code" = "200" ] || fail=1

            # The security headers live in _worker.js, and they only reach the
            # page because Pages runs the script ahead of the asset server.
            # A _routes.json excluding "/" would silently drop them from the
            # page while leaving them on the API. That exact bug shipped once
            # already on Workers. Check the page itself.
            headers=$(curl -s -o /dev/null -D - --max-time 30 "$URL/")
            headers_lc=$(printf '%s' "$headers" | tr 'A-Z' 'a-z')
            case "$headers_lc" in
              *content-security-policy:*) echo "  CSP present on / -> yes" ;;
              *) echo "  CSP MISSING on / -- the asset server is running ahead of _worker.js"; fail=1 ;;
            esac

            # Pages answers an unmatched path with index.html and a 200 unless
            # public/404.html exists. Deleting that file turns every wrong URL
            # into an indexable duplicate of the landing page.
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/nonexistent")
            echo "  GET /nonexistent -> $code"
            [ "$code" = "404" ] || fail=1

            # The canonical URL is what stops old or duplicate hostnames
            # serving this same HTML from competing with the real one. It is a
            # hardcoded absolute URL, so it silently goes stale on a move.
            html=$(curl -s --max-time 30 "$URL/")
            case "$html" in
              *"rel=\"canonical\" href=\"$URL/\""*) echo "  canonical matches $URL -> yes" ;;
              *) echo "  canonical MISSING or pointing elsewhere -- check public/index.html"; fail=1 ;;
            esac

            return $fail
          }

          for attempt in 1 2 3 4 5 6; do
            echo "verify attempt $attempt/6"
            if verify; then
              echo "production verified"
              exit 0
            fi
            [ "$attempt" = "6" ] && break
            echo "not green yet, waiting 15s..."
            sleep 15
          done

          echo "production FAILED verification after 6 attempts"
          exit 1
