name: Deploy

# Merged means live. Without this, `main` and production drift silently:
# a PR can sit unmerged while its code is already deployed, or land and
# never ship. Both happened during development.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # dist/ is gitignored, so CI must build it or there is nothing to upload.
      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        # --branch=main is explicit rather than inferred: Pages treats the
        # production branch by name, and a deploy that silently lands as a
        # preview would leave production stale while the run goes green.
        run: npx wrangler pages deploy --branch=main
        env:
          # This token needs BOTH "Cloudflare Pages: Edit" and "Account
          # Settings: Read". The "Edit Cloudflare Workers" template does not
          # include Pages, so a token that worked for `wrangler deploy` will
          # fail here with an authentication error.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Not a secret — it appears in every dashboard URL. Kept inline so
          # the deploy does not gain a second way to fail on a missing secret.
          CLOUDFLARE_ACCOUNT_ID: 9b76753285cc0229e3f5161d25710d45

      # Deploying is not the same as working. Prove the page and the API
      # actually respond before calling the run green.
      - name: Verify production
        run: |
          set -euo pipefail
          URL="https://1099-int-check.pages.dev"

          echo "Waiting for the new version to propagate..."
          sleep 15

          fail=0

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/healthz")
          echo "GET /healthz -> $code"
          [ "$code" = "200" ] || fail=1

          status=$(curl -s --max-time 30 "$URL/api/status")
          echo "GET /api/status -> $status"
          echo "$status" | grep -q '"configured":true' || fail=1

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/")
          echo "GET / -> $code"
          [ "$code" = "200" ] || fail=1

          # The security headers live in _worker.js, and they only reach the
          # page because Pages runs the script ahead of the asset server.
          # A _routes.json excluding "/" would silently drop them from the
          # page while leaving them on the API. That exact bug shipped once
          # already on Workers. Check the page itself.
          if curl -s -o /dev/null -D - --max-time 30 "$URL/" | grep -qi '^content-security-policy'; then
            echo "CSP present on / -> yes"
          else
            echo "CSP MISSING on / -- the asset server is running ahead of _worker.js"
            fail=1
          fi

          # Pages answers an unmatched path with index.html and a 200 unless
          # public/404.html exists. Deleting that file turns every wrong URL
          # into an indexable duplicate of the landing page.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/nonexistent")
          echo "GET /nonexistent -> $code"
          [ "$code" = "404" ] || fail=1

          exit $fail
