name: Deploy

# Merged means live. Without this, `main` and production drift silently:
# a PR can sit unmerged while its code is already deployed, or land and
# never ship. Both happened during development.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Deploying is not the same as working. Prove the page and the API
      # actually respond before calling the run green.
      - name: Verify production
        run: |
          set -euo pipefail
          URL="https://1099-int-check.ashabbas-2023.workers.dev"

          echo "Waiting for the new version to propagate..."
          sleep 15

          fail=0

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/healthz")
          echo "GET /healthz -> $code"
          [ "$code" = "200" ] || fail=1

          status=$(curl -s --max-time 30 "$URL/api/status")
          echo "GET /api/status -> $status"
          echo "$status" | grep -q '"configured":true' || fail=1

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/")
          echo "GET / -> $code"
          [ "$code" = "200" ] || fail=1

          # The security headers live in the Worker, and a wrong assets
          # setting silently drops them from the page while leaving them
          # on the API. That shipped once already. Check the page itself.
          if curl -s -o /dev/null -D - --max-time 30 "$URL/" | grep -qi '^content-security-policy'; then
            echo "CSP present on / -> yes"
          else
            echo "CSP MISSING on / -- run_worker_first is probably unset"
            fail=1
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/nonexistent")
          echo "GET /nonexistent -> $code"
          [ "$code" = "404" ] || fail=1

          exit $fail
